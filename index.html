<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#160b24">
  <title>Love Me? 💜</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f1ff;
      --muted: #c9b8dc;
      --purple: #995be4;
      --purple-dark: #b27af3;
      --lavender: #2b1942;
      --pink: #f1a0ca;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 14% 18%, #542563 0, transparent 36%),
        radial-gradient(ellipse at 88% 86%, #382063 0, transparent 40%),
        linear-gradient(145deg, #12091f, #1b0d2c 52%, #190923);
      font-family: Vazirmatn, Tahoma, "Segoe UI", Arial, sans-serif;
    }

    .orb {
      position: fixed;
      z-index: 0;
      width: 220px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, #d9b8ff12, #ffffff02);
      border: 1px solid #e7d7ff17;
      box-shadow: inset 0 0 50px #d9b8ff0b;
      pointer-events: none;
    }
    .orb.one { top: -92px; left: -72px; }
    .orb.two { right: -112px; bottom: -120px; width: 310px; }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      padding: clamp(28px, 7vw, 48px) clamp(20px, 6vw, 40px) 30px;
      text-align: center;
      border: 1px solid #e6d1ff2e;
      border-radius: 30px;
      background: #211332e8;
      box-shadow: 0 24px 70px #08031175, 0 3px 18px #7a48b31c;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .heart-mark {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 23px;
      color: #fff;
      background: linear-gradient(145deg, #c18aff, #8d4bdd 70%);
      box-shadow: 0 12px 24px #8d4bdd50;
      font-size: 31px;
      transform: rotate(-5deg);
    }

    .eyebrow {
      margin: 0 0 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      min-height: 2.3em;
      margin: 0;
      display: grid;
      place-items: center;
      font-size: clamp(22px, 6vw, 29px);
      line-height: 1.7;
      font-weight: 800;
      letter-spacing: -.035em;
      transition: opacity .2s ease, transform .2s ease;
    }

    .hint {
      min-height: 24px;
      margin: 4px 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .action-zone {
      position: relative;
      width: 100%;
      height: 112px;
      touch-action: manipulation;
    }

    button {
      min-width: 82px;
      min-height: 48px;
      padding: 11px 21px;
      border: 1px solid transparent;
      border-radius: 15px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    button:focus-visible {
      outline: 3px solid #b999f3;
      outline-offset: 4px;
    }

    button:active { transform: scale(.96); }

    .yes-button, .heart-button {
      position: absolute;
      top: 13px;
      right: calc(50% + 7px);
      color: #fff;
      background: var(--purple);
      box-shadow: 0 7px 18px #995be448;
    }

    .yes-button:hover, .heart-button:hover {
      background: var(--purple-dark);
      box-shadow: 0 10px 22px #995be45c;
    }

    .no-button {
      position: absolute;
      top: 13px;
      right: calc(50% - 89px);
      color: #eadcff;
      border-color: #71558f;
      background: #2b1942;
      box-shadow: 0 5px 14px #08031136;
      user-select: none;
    }

    .no-button:hover { border-color: #ad8bd3; }

    .heart-button {
      right: 50%;
      min-width: 62px;
      color: #fff;
      font-size: 21px;
      transform: translateX(50%);
    }
    .heart-button:active { transform: translateX(50%) scale(.96); }

    .footer {
      margin: 4px 0 0;
      color: #b6a4cd;
      font-size: 11px;
    }

    .fade { opacity: 0; transform: translateY(5px); }

    @media (max-width: 360px) {
      body { padding: 14px; }
      main { border-radius: 25px; }
      .hint { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>

  <main aria-labelledby="question">
    <div class="heart-mark" aria-hidden="true">♡</div>
    <p class="eyebrow">یه سؤال کوچولو</p>
    <h1 id="question" aria-live="polite">سلام میتونم یه سوال بپرسم؟</h1>
    <p class="hint" id="hint">قول می‌دم جوابش خیلی کوتاهه :)</p>

    <div class="action-zone" id="action-zone">
      <button class="yes-button" id="yes-button" type="button">آره</button>
      <button class="no-button" id="no-button" type="button">نه</button>
      <button class="heart-button" id="heart-button" type="button" aria-label="قلب" hidden>♡</button>
    </div>

    <p class="footer">ساخته‌شده با یه ذره عشق 💜</p>
  </main>

  <script>
    const question = document.getElementById("question");
    const hint = document.getElementById("hint");
    const zone = document.getElementById("action-zone");
    const yesButton = document.getElementById("yes-button");
    const noButton = document.getElementById("no-button");
    const heartButton = document.getElementById("heart-button");
    let stage = 0;
    let hasTeleported = false;

    function setMessage(title, subtitle) {
      question.classList.add("fade");
      window.setTimeout(() => {
        question.textContent = title;
        hint.textContent = subtitle;
        question.classList.remove("fade");
      }, 120);
    }

    function beginQuestion() {
      stage = 1;
      setMessage("دوسم داری؟", "این‌بار انتخاب با توئه 😉");
    }

    function sayYes() {
      stage = 2;
      yesButton.hidden = true;
      noButton.hidden = true;
      heartButton.hidden = false;
      setMessage("منم دوست دارم:)", "یه قلب کوچولو برای تو 💜");
      document.querySelector(".heart-mark").textContent = "♥";
    }

    function sayNoAtStart() {
      stage = 3;
      yesButton.hidden = true;
      noButton.hidden = true;
      setMessage("باشه، هر وقت خواستی :) ", "ممنون که جواب دادی.");
    }

    function teleportNo() {
      if (stage !== 1) return;
      const noRect = noButton.getBoundingClientRect();
      const yesRect = yesButton.getBoundingClientRect();
      const viewportWidth = document.documentElement.clientWidth;
      const viewportHeight = document.documentElement.clientHeight;
      const margin = 14;
      const maxX = Math.max(0, viewportWidth - noRect.width - margin);
      const maxY = Math.max(0, viewportHeight - noRect.height - margin);
      const minX = Math.min(margin, maxX);
      const minY = Math.min(margin, maxY);
      let x = 0;
      let y = 0;
      let safeSpot = false;

      for (let attempt = 0; attempt < 30; attempt += 1) {
        x = minX + Math.random() * (maxX - minX);
        y = minY + Math.random() * (maxY - minY);
        const left = x;
        const top = y;
        const separated =
          left + noRect.width + 14 < yesRect.left ||
          left > yesRect.right + 14 ||
          top + noRect.height + 10 < yesRect.top ||
          top > yesRect.bottom + 10;
        if (separated) {
          safeSpot = true;
          break;
        }
      }

      if (!safeSpot) {
        x = maxX;
        y = maxY;
      }

      noButton.style.position = "fixed";
      noButton.style.right = "auto";
      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
      hasTeleported = true;
    }

    yesButton.addEventListener("click", () => {
      if (stage === 0) beginQuestion();
      else if (stage === 1) sayYes();
    });

    noButton.addEventListener("click", () => {
      if (stage === 0) sayNoAtStart();
      else teleportNo();
    });

    noButton.addEventListener("pointerenter", (event) => {
      if (stage === 1 && event.pointerType === "mouse") teleportNo();
    });

    heartButton.addEventListener("click", () => {
      heartButton.textContent = "♥";
      heartButton.disabled = true;
      setMessage("منم دوست دارم:)", "همیشه دوست‌داشتنی باشی!");
    });

    window.addEventListener("resize", () => {
      if (stage === 1 && hasTeleported) teleportNo();
    });
  </script>
</body>
</html>
